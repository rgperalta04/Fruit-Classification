<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruit Classification</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>Fruit Classification</h1>
      </header>

      <main class="panel">
        <div class="camera-box">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="canvas" width="160" height="160" style="display:none"></canvas>
        </div>

        <div class="result-box">
          <p class="label-title">Predicción</p>
          <p id="result" class="result-text">Cargando modelo...</p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
